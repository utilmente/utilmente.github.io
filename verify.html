<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canjear Código Premium</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        
        body {
            background: #111827;
            color: white;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        
        .input-code {
            width: 100%;
            padding: 15px;
            background: #1f2937;
            border: 2px solid #374151;
            border-radius: 10px;
            color: white;
            font-size: 18px;
            text-align: center;
            margin: 20px 0;
        }
        
        .btn {
            width: 100%;
            padding: 15px;
            background: #10b981;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
        
        .btn:hover {
            background: #059669;
        }
        
        .result {
            margin-top: 20px;
            padding: 20px;
            background: rgba(16, 185, 129, 0.2);
            border: 2px solid #10b981;
            border-radius: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔑 Activar Código Premium</h1>
        <p>Ingresa el código que recibiste:</p>
        
        <input type="text" id="codeInput" class="input-code" 
               placeholder="PRE-XXXX-XXXXXX" maxlength="17" autofocus>
        
        <button id="verifyBtn" class="btn">ACTIVAR CÓDIGO</button>
        
        <div id="result" class="result">
            <h2>✅ ¡ACTIVADO!</h2>
            <p id="message"></p>
            <button id="goBtn" class="btn" style="margin-top: 10px;">
                IR A SECCIÓN PREMIUM
            </button>
        </div>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbxazYQ1ZQUZNZ2WWR73W6gL_hn54KX7ptt0WuWpHoG8du-ake24aU4HUe3irv-Efjs1AA/exec';
        
        const codeInput = document.getElementById('codeInput');
        const verifyBtn = document.getElementById('verifyBtn');
        const result = document.getElementById('result');
        const message = document.getElementById('message');
        const goBtn = document.getElementById('goBtn');
        
        // SOLO go:premiumpro - SIN parámetros
        function redirectToPremium() {
            console.log('🔗 Intentando abrir: go:premiumpro');
            window.location.href = 'go:premiumpro';
            // ESTO DEBERÍA DAR EL ERROR: net::ERR_UNKNOWN_URL_SCHEME
        }
        
        async function verifyCode() {
            const code = codeInput.value.trim().toUpperCase();
            
            if (!code) {
                alert('Ingresa un código');
                return;
            }
            
            try {
                const response = await fetch(`${API_URL}?action=verify_code&code=${encodeURIComponent(code)}`);
                const data = await response.json();
                
                if (data.success) {
                    message.textContent = `Código ${code} activado correctamente`;
                    result.style.display = 'block';
                    
                    // Configurar botón para SOLO go:premiumpro
                    goBtn.onclick = redirectToPremium;
                    
                    // Limpiar input
                    codeInput.value = '';
                    
                } else {
                    alert('❌ ' + (data.message || 'Código no válido'));
                }
                
            } catch (error) {
                alert('Error de conexión');
            }
        }
        
        verifyBtn.addEventListener('click', verifyCode);
        
        codeInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') verifyCode();
        });
        
        // Autoformatear
        codeInput.addEventListener('input', function() {
            let value = this.value.toUpperCase().replace(/[^A-Z0-9\-]/g, '');
            if (value.length > 3 && value[3] !== '-') {
                value = value.slice(0, 3) + '-' + value.slice(3);
            }
            if (value.length > 8 && value[8] !== '-') {
                value = value.slice(0, 8) + '-' + value.slice(8);
            }
            if (value.length > 17) value = value.slice(0, 17);
            this.value = value;
        });
        
        // Enfocar
        codeInput.focus();
    </script>
</body>
</html>
