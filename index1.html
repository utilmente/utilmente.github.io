<!DOCTYPE html>
<html>
<head>
    <title>Sistema Premium - Menú</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: linear-gradient(135deg, #111827 0%, #2d1b69 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .menu-container {
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        .logo {
            font-size: 48px;
            color: #7c3aed;
            margin-bottom: 20px;
        }
        .menu-title {
            font-size: 32px;
            margin-bottom: 30px;
            color: #fbbf24;
        }
        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .menu-btn {
            padding: 20px;
            background: rgba(30, 41, 59, 0.8);
            border: 2px solid #4b5563;
            border-radius: 16px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        .menu-btn:hover {
            transform: translateY(-5px);
            border-color: #7c3aed;
            background: rgba(124, 58, 237, 0.2);
        }
        .user-btn { border-left: 5px solid #10b981; }
        .admin-btn { border-left: 5px solid #f59e0b; }
        .verify-btn { border-left: 5px solid #3b82f6; }
        .footer {
            margin-top: 40px;
            color: #94a3b8;
            font-size: 14px;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="menu-container">
        <div class="logo">
            <i class="fas fa-crown"></i>
        </div>
        
        <h1 class="menu-title">Sistema Premium - Menú Principal</h1>
        
        <div class="menu-buttons">
            <a href="index.html" class="menu-btn user-btn">
                <i class="fas fa-user-check"></i> Verificar mi pago
            </a>
            
            <a href="admin.html" class="menu-btn admin-btn">
                <i class="fas fa-user-shield"></i> Panel de Administración
            </a>
            
            <a href="verify.html" class="menu-btn verify-btn">
                <i class="fas fa-key"></i> Canjear código premium
            </a>
        </div>
        
        <div class="footer">
            <p>© 2025 Sistema de Verificación Premium</p>
            <p>Acceso seguro y encriptado</p>
        </div>
    </div>
</body>
</html>
